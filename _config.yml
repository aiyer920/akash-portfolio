# Site settings
title: "Akash Iyer's Portfolio"
description: "Akash's portfolio for showcasing robotics and mechatronics projects with 3D models, schematics, and code"
url: "https://akashiyer2022-netizen.github.io"
baseurl: "/akash-portfolio"
author: "Akash Iyer"
email: "akashiyer2022@gmail.com"
github_username: "aiyer920"
linkedin_username: "akash-iyer"
twitter_username: "your-twitter"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Site navigation
navigation:
  - title: "Home"
    url: "/"
  - title: "Projects"
    url: "/projects/"
  - title: "About"
    url: "/about/"

# Project categories
project_categories:
  - name: "Robotics"
    slug: "robotics"
    description: "Autonomous robots and robotic systems"
  - name: "Mechatronics"
    slug: "mechatronics"
    description: "Integration of mechanical, electrical, and software systems"
  - name: "Machine Learning"
    slug: "machine-learning"
    description: "Projects and research in machine learning and AI"
  - name: "Design and Manufacturing"
    slug: "design-and-manufacturing"
    description: "Custom manufactured components and designs"
  - name: "Perception"
    slug: "perception"
    description: "Sensor data processing and computer vision"

# 3D Model settings
models:
  supported_formats: ["stl", "obj", "gltf", "glb"]
  default_background: "#f0f0f0"
  camera_controls: true
  auto_rotate: false

# Schema settings
schematics:
  supported_formats: ["png", "jpg", "jpeg", "svg", "pdf"]
  zoom_enabled: true
  pan_enabled: true
